name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libfontconfig1 libgl1 libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 libxrender1 unzip

      - name: Install Godot
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Headless suite
        run: chmod +x tools/ci.sh && ./tools/ci.sh
