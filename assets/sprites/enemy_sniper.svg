<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a94"/>
      <stop offset="0.5" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#90909a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- minimal wings -->
  <path d="M18 27 L9 30 L11 34 L18 31 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.3"/>
  <path d="M30 27 L39 30 L37 34 L30 31 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.3"/>
  <!-- long needle nose / barrel extending upward -->
  <path d="M24 0 L22 3 L22 22 L26 22 L26 3 Z" fill="url(#hull)" stroke="#17171e" stroke-width="1.3"/>
  <!-- needle tip highlight -->
  <path d="M24 0 L22 3 L24 4.5 Z" fill="#d9d9e0"/>
  <path d="M24 0 L26 3 L24 4.5 Z" fill="#a5a5af"/>
  <!-- barrel detail rings -->
  <line x1="22" y1="8" x2="26" y2="8" stroke="#5c5c66" stroke-width="0.9"/>
  <line x1="22" y1="12" x2="26" y2="12" stroke="#5c5c66" stroke-width="0.9"/>
  <line x1="22" y1="16" x2="26" y2="16" stroke="#5c5c66" stroke-width="0.9"/>
  <!-- narrow fuselage -->
  <path d="M19 18 L29 18 L31 32 L24 42 L17 32 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5"/>
  <!-- fuselage top shading -->
  <path d="M19 18 L29 18 L24 23 Z" fill="#b5b5bf"/>
  <path d="M24 23 L19 18 L19 22 Z" fill="#a5a5af"/>
  <path d="M24 23 L29 18 L29 22 Z" fill="#d0d0d8"/>
  <!-- center spine -->
  <rect x="22.2" y="18" width="3.6" height="20" rx="1" fill="url(#hull)" stroke="#17171e" stroke-width="0.9"/>
  <!-- scope / eye -->
  <circle cx="24" cy="26" r="5" fill="#14141b" stroke="#3c3c46" stroke-width="0.9"/>
  <circle cx="24" cy="26" r="3.2" fill="#2a2a32" stroke="#4a4a54" stroke-width="0.6"/>
  <circle cx="24" cy="26" r="1.8" fill="#7a7c8a"/>
  <circle cx="24.8" cy="25" r="0.7" fill="#ffffff" opacity="0.9"/>
  <!-- small sensor line below scope -->
  <line x1="22" y1="31.5" x2="26" y2="31.5" stroke="#5c5c66" stroke-width="0.9"/>
  <line x1="22.5" y1="34" x2="25.5" y2="34" stroke="#5c5c66" stroke-width="0.8"/>
  <!-- thruster single minimal -->
  <rect x="19.5" y="40" width="9" height="5" rx="1.6" fill="#55555f" stroke="#17171e" stroke-width="1.2"/>
  <ellipse cx="24" cy="45" rx="2.6" ry="1.4" fill="#2a2a32" stroke="#17171e" stroke-width="0.7"/>
  <!-- engine glow -->
  <ellipse cx="24" cy="47" rx="6.5" ry="2.4" fill="url(#glow)"/>
  <circle cx="24" cy="46.5" r="1.9" fill="#fffbe8"/>
</svg>
