<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#7c7c86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- side fins -->
  <path d="M13 18 L3 24 L5 33 L13 28 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.5"/>
  <path d="M39 18 L49 24 L47 33 L39 28 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.5"/>
  <path d="M11 28 L4 28 L6 32 Z" fill="#6e6e78" stroke="#17171e" stroke-width="1"/>
  <path d="M41 28 L48 28 L46 32 Z" fill="#6e6e78" stroke="#17171e" stroke-width="1"/>
  <!-- main angular upper hull -->
  <path d="M18 10 L34 10 L41 18 L41 30 L34 38 L18 38 L11 30 L11 18 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5"/>
  <!-- top shading -->
  <path d="M18 10 L34 10 L26 18 Z" fill="#b5b5bf"/>
  <path d="M26 18 L11 18 L18 10 Z" fill="#a5a5af"/>
  <path d="M26 18 L41 18 L34 10 Z" fill="#d0d0d8"/>
  <!-- cockpit -->
  <path d="M20 10 L32 10 L31 16 L21 16 Z" fill="url(#hull)" stroke="#17171e" stroke-width="1.2"/>
  <ellipse cx="26" cy="14" rx="5" ry="2.8" fill="#14141b" stroke="#3c3c46" stroke-width="0.8"/>
  <ellipse cx="27" cy="13.2" rx="1.2" ry="0.7" fill="#7a7c8a" opacity="0.7"/>
  <!-- bulging central bomb bay (rounded belly) -->
  <ellipse cx="26" cy="30" rx="13.5" ry="10.5" fill="url(#hull)" stroke="#17171e" stroke-width="1.5"/>
  <ellipse cx="26" cy="31" rx="10" ry="7.5" fill="#b8b8c2" stroke="#17171e" stroke-width="1"/>
  <!-- bomb bay doors -->
  <line x1="16" y1="31" x2="36" y2="31" stroke="#17171e" stroke-width="1.2"/>
  <line x1="26" y1="23.5" x2="26" y2="38.5" stroke="#17171e" stroke-width="1.1"/>
  <line x1="26" y1="23.5" x2="26" y2="38.5" stroke="#5c5c66" stroke-width="0.6" stroke-dasharray="2 2"/>
  <!-- door handle rivets -->
  <circle cx="22" cy="31" r="1" fill="#7c7c86" stroke="#17171e" stroke-width="0.6"/>
  <circle cx="30" cy="31" r="1" fill="#7c7c86" stroke="#17171e" stroke-width="0.6"/>
  <!-- lower belly plate line -->
  <path d="M18 36 C18 36 22 39 26 39 C30 39 34 36 34 36" fill="none" stroke="#5c5c66" stroke-width="0.9"/>
  <!-- twin engine pods under wings -->
  <rect x="14" y="37" width="9" height="8" rx="2" fill="#55555f" stroke="#17171e" stroke-width="1.3"/>
  <rect x="29" y="37" width="9" height="8" rx="2" fill="#55555f" stroke="#17171e" stroke-width="1.3"/>
  <ellipse cx="18.5" cy="45" rx="3" ry="1.6" fill="#2a2a32" stroke="#17171e" stroke-width="0.8"/>
  <ellipse cx="33.5" cy="45" rx="3" ry="1.6" fill="#2a2a32" stroke="#17171e" stroke-width="0.8"/>
  <!-- engine glow -->
  <ellipse cx="26" cy="50.5" rx="10" ry="2.6" fill="url(#glow)"/>
  <ellipse cx="18.5" cy="46.8" rx="2.2" ry="1.2" fill="#fffbe8" opacity="0.95"/>
  <ellipse cx="33.5" cy="46.8" rx="2.2" ry="1.2" fill="#fffbe8" opacity="0.95"/>
</svg>
