  <ellipse cx="15.2" cy="40.2" rx="3.2" ry="2.8" fill="#2f2e2b" stroke="#1c1a16" stroke-width="0.7"/>
  <ellipse cx="15.2" cy="40.2" rx="3.2" ry="2.8" fill="#3e3c38" opacity="0.9"/>
  <ellipse cx="14.6" cy="39.5" rx="1.9" ry="1.6" fill="#5a5752" stroke="#6e6b64" stroke-width="0.35" opacity="0.85"/>

  <!-- highlight edge chips -->
  <path d="M27 2 L28.5 5.5 L26 6 Z" fill="#ece8dc" opacity="0.85"/>
  <path d="M39 7 L41 10 L38.5 11 Z" fill="#ece8dc" opacity="0.6"/>
  <path d="M48 41 L45 43 L46.5 46 Z" fill="#3e3c38" opacity="0.7"/>
