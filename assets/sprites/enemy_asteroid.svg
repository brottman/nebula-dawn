  <circle cx="11" cy="27" r="0.9" fill="#3a3832" opacity="0.7"/>
  <circle cx="13.5" cy="29.5" r="0.7" fill="#3a3832" opacity="0.6"/>
  <circle cx="42" cy="31" r="0.8" fill="#2e2c28" opacity="0.65"/>
  <circle cx="45" cy="35" r="0.6" fill="#2e2c28" opacity="0.6"/>
  <circle cx="28" cy="10" r="0.7" fill="#4a4742" opacity="0.7"/>

  <!-- CRATER 1 - large left -->
  <ellipse cx="18.5" cy="26.5" rx="7.2" ry="6.4" fill="#2f2e2b" stroke="#1c1a16" stroke-width="1.1"/>
  <ellipse cx="18.5" cy="26.5" rx="7.2" ry="6.4" fill="url(#craterShade)" opacity="0.95"/>
  <ellipse cx="17.2" cy="25.2" rx="4.8" ry="4.2" fill="#4e4b45" stroke="#6e6b64" stroke-width="0.5" opacity="0.9"/>
