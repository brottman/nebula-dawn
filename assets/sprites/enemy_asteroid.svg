<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <radialGradient id="craterShade" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6b6860"/>
      <stop offset="0.55" stop-color="#3e3c38"/>
      <stop offset="1" stop-color="#1e1d1a"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c5b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7a7770" stop-opacity="0"/>
