  <ellipse cx="34.5" cy="15.2" rx="4.4" ry="3.9" fill="#2f2e2b" stroke="#1c1a16" stroke-width="0.9"/>
  <ellipse cx="34.5" cy="15.2" rx="4.4" ry="3.9" fill="url(#craterShade)" opacity="0.95"/>
  <ellipse cx="33.6" cy="14.3" rx="2.7" ry="2.3" fill="#4e4b45" stroke="#6b6860" stroke-width="0.45" opacity="0.9"/>
  <ellipse cx="33" cy="13.7" rx="0.9" ry="0.7" fill="#8a8680" opacity="0.5"/>
  <path d="M30.8 12.8 A4.4 3.9 0 0 1 33.2 11.6" fill="none" stroke="#d4d0c5" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>

  <!-- CRATER 3 - lower right -->
  <ellipse cx="36.2" cy="38.2" rx="5.8" ry="5.2" fill="#2f2e2b" stroke="#1c1a16" stroke-width="1.0"/>
  <ellipse cx="36.2" cy="38.2" rx="5.8" ry="5.2" fill="url(#craterShade)" opacity="0.95"/>
  <ellipse cx="35" cy="36.9" rx="3.6" ry="3.1" fill="#4e4b45" stroke="#6e6b64" stroke-width="0.5" opacity="0.9"/>
  <ellipse cx="34.3" cy="36.1" rx="1.1" ry="0.85" fill="#7a7770" opacity="0.5"/>
  <path d="M31.2 34.8 A5.8 5.2 0 0 1 35 33.5" fill="none" stroke="#c9c5b8" stroke-width="0.75" stroke-linecap="round" opacity="0.5"/>

