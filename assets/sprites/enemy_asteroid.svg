  <path d="M31 32 L41 38 L38 51 L27 44 Z" fill="#6e6b64" stroke="#1c1a16" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M9 31 L16 24 L31 32 L17 38 L12 48 L4 35 Z" fill="#7d7a72" stroke="#1c1a16" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M17 38 L27 44 L25 54 L12 48 Z" fill="#5e5b54" stroke="#1c1a16" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M48 41 L38 51 L41 38 L53 28 Z" fill="#5a5751" stroke="#1c1a16" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- fissure cracks -->
  <path d="M21 14 L19 22 L24 29 L22 38" fill="none" stroke="#2e2c28" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M31 32 L27 36 L32 42" fill="none" stroke="#2e2c28" stroke-width="0.75" stroke-linecap="round" opacity="0.85"/>
  <path d="M16 24 L12 28 L15 34" fill="none" stroke="#3a3833" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
