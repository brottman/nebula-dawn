<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a94"/>
      <stop offset="0.5" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#90909a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- swept delta wings -->
  <path d="M20.2 18.5 L3.5 33.5 L10 41 L19.5 28.5 L20.2 18.5 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M27.8 18.5 L44.5 33.5 L38 41 L28.5 28.5 L27.8 18.5 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- wing shading -->
  <path d="M20.2 18.5 L3.5 33.5 L10 41 L19.5 28.5 Z" fill="#a5a5af" opacity="0.55"/>
  <path d="M27.8 18.5 L44.5 33.5 L38 41 L28.5 28.5 Z" fill="#b5b5bf" opacity="0.6"/>
  <!-- afterburner side fins -->
  <path d="M11.5 38 L8 46 L12.5 46 L14 39 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M36.5 38 L40 46 L35.5 46 L34 39 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- central narrow fuselage - sharp point -->
  <path d="M24 1.5 L19 18 L19.5 42.5 L28.5 42.5 L29 18 Z" fill="url(#hull)" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- nose highlight -->
  <path d="M24 1.5 L21.2 16 L24 13.5 L26.8 16 Z" fill="#d9d9e0"/>
  <!-- cockpit canopy -->
  <rect x="22" y="8.5" width="4" height="8" rx="2" fill="#14141b" stroke="#3c3c46" stroke-width="0.8"/>
  <!-- fuselage panel lines -->
  <line x1="21" y1="22" x2="27" y2="22" stroke="#5c5c66" stroke-width="1"/>
  <line x1="21" y1="26" x2="27" y2="26" stroke="#5c5c66" stroke-width="1"/>
  <line x1="21" y1="30" x2="27" y2="30" stroke="#5c5c66" stroke-width="1"/>
  <!-- engine housings -->
  <rect x="16.5" y="40.5" width="5.5" height="5" rx="1.2" fill="#55555f" stroke="#17171e" stroke-width="1.2"/>
  <rect x="26" y="40.5" width="5.5" height="5" rx="1.2" fill="#55555f" stroke="#17171e" stroke-width="1.2"/>
  <!-- aerodynamic strakes -->
  <path d="M19.5 30 L17 36 L19 36 Z" fill="#7a7a84" stroke="#17171e" stroke-width="1"/>
  <path d="M28.5 30 L31 36 L29 36 Z" fill="#7a7a84" stroke="#17171e" stroke-width="1"/>
  <!-- engine glow -->
  <ellipse cx="24" cy="47" rx="9" ry="2.8" fill="url(#glow)"/>
  <ellipse cx="19.2" cy="46.5" rx="2.2" ry="1.4" fill="#fffbe8"/>
  <ellipse cx="28.8" cy="46.5" rx="2.2" ry="1.4" fill="#fffbe8"/>
</svg>
