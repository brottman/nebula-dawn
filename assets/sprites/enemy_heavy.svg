<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a94"/>
      <stop offset="0.5" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#90909a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- main broad slab hull -->
  <path d="M6 14 L46 14 L50 19 L50 37 L46 42 L6 42 L2 37 L2 19 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5"/>
  <!-- top bevel shading for 3D read (flat top) -->
  <path d="M6 14 L46 14 L26 22 Z" fill="#b5b5bf"/>
  <path d="M26 22 L2 19 L6 14 Z" fill="#a5a5af"/>
  <path d="M26 22 L50 19 L46 14 Z" fill="#d0d0d8"/>
  <!-- cockpit bump on top center -->
  <path d="M20 6 L32 6 L34 14 L18 14 Z" fill="url(#hull)" stroke="#17171e" stroke-width="1.5"/>
  <rect x="22.5" y="8" width="7" height="4" rx="1.2" fill="#14141b" stroke="#3c3c46" stroke-width="0.8"/>
  <circle cx="24.5" cy="9.5" r="0.7" fill="#6a6a78" opacity="0.9"/>
  <!-- heavy side armor plates (overlay) -->
  <rect x="5" y="20" width="11" height="17" rx="1.8" fill="#b8b8c2" stroke="#17171e" stroke-width="1.3"/>
  <rect x="36" y="20" width="11" height="17" rx="1.8" fill="#b8b8c2" stroke="#17171e" stroke-width="1.3"/>
  <!-- plate detail lines -->
  <line x1="7.5" y1="26" x2="13.5" y2="26" stroke="#5c5c66" stroke-width="1.1"/>
  <line x1="7.5" y1="31" x2="13.5" y2="31" stroke="#5c5c66" stroke-width="1.1"/>
  <line x1="38.5" y1="26" x2="44.5" y2="26" stroke="#5c5c66" stroke-width="1.1"/>
  <line x1="38.5" y1="31" x2="44.5" y2="31" stroke="#5c5c66" stroke-width="1.1"/>
  <!-- rivets on armor plates -->
  <circle cx="7.5" cy="22.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="13.5" cy="22.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="7.5" cy="34.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="13.5" cy="34.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="38.5" cy="22.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="44.5" cy="22.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="38.5" cy="34.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <circle cx="44.5" cy="34.5" r="1.1" fill="#7c7c86" stroke="#17171e" stroke-width="0.7"/>
  <!-- center hull vent/detail -->
  <rect x="19" y="24" width="14" height="10" rx="1.5" fill="#9c9ca6" stroke="#17171e" stroke-width="1"/>
  <line x1="21" y1="27" x2="31" y2="27" stroke="#5c5c66" stroke-width="1"/>
  <line x1="21" y1="31" x2="31" y2="31" stroke="#5c5c66" stroke-width="1"/>
  <!-- twin large thrusters at bottom -->
  <rect x="9" y="40" width="12" height="9" rx="2.2" fill="#55555f" stroke="#17171e" stroke-width="1.3"/>
  <rect x="31" y="40" width="12" height="9" rx="2.2" fill="#55555f" stroke="#17171e" stroke-width="1.3"/>
  <ellipse cx="15" cy="47" rx="4" ry="1.8" fill="#2a2a32" stroke="#17171e" stroke-width="0.8"/>
  <ellipse cx="37" cy="47" rx="4" ry="1.8" fill="#2a2a32" stroke="#17171e" stroke-width="0.8"/>
  <!-- engine glow -->
  <ellipse cx="26" cy="51" rx="13" ry="2.8" fill="url(#glow)"/>
  <ellipse cx="15" cy="48.5" rx="2.8" ry="1.4" fill="#fffbe8" opacity="0.95"/>
  <ellipse cx="37" cy="48.5" rx="2.8" ry="1.4" fill="#fffbe8" opacity="0.95"/>
</svg>
