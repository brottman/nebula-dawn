<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8a94"/>
      <stop offset="0.5" stop-color="#f4f4f8"/>
      <stop offset="1" stop-color="#90909a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- twin prongs / fork nose - left -->
  <path d="M14.5 3.5 L9 18.5 L16.5 21.5 L21 13 L17.2 5 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- twin prongs / fork nose - right -->
  <path d="M33.5 3.5 L39 18.5 L31.5 21.5 L27 13 L30.8 5 Z" fill="#c9c9d2" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- prong inner shading -->
  <path d="M14.5 3.5 L11.2 14 L16.5 21.5 L21 13 L17.2 5 Z" fill="#a5a5af"/>
  <path d="M33.5 3.5 L36.8 14 L31.5 21.5 L27 13 L30.8 5 Z" fill="#b5b5bf"/>
  <!-- prong tip highlights -->
  <path d="M14.5 3.5 L12 11 L15 9 Z" fill="#d9d9e0"/>
  <path d="M33.5 3.5 L36 11 L33 9 Z" fill="#d9d9e0"/>
  <!-- insect-like lateral barbs -->
  <path d="M16.2 24 L7 27.5 L8 31.5 L16.8 28 Z" fill="#a5a5af" stroke="#17171e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M31.8 24 L41 27.5 L40 31.5 L31.2 28 Z" fill="#a5a5af" stroke="#17171e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M15.8 31.5 L7.5 35 L8.5 38.5 L16.5 35 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M32.2 31.5 L40.5 35 L39.5 38.5 L31.5 35 Z" fill="#8e8e98" stroke="#17171e" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- central spine / body bridging the fork gap -->
  <path d="M24 10.5 L18.5 19.5 L18 35 C18 40 19.8 43.5 24 43.5 C28.2 43.5 30 40 30 35 L29.5 19.5 Z" fill="url(#hull)" stroke="#17171e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- central gap shadow between prongs -->
  <path d="M21 13 L24 10.5 L27 13 L26 18 L22 18 Z" fill="#2a2a34" stroke="#17171e" stroke-width="1"/>
  <!-- body panel detail -->
  <line x1="21" y1="24" x2="27" y2="24" stroke="#5c5c66" stroke-width="1"/>
  <line x1="21" y1="28" x2="27" y2="28" stroke="#5c5c66" stroke-width="1"/>
  <line x1="21" y1="32" x2="27" y2="32" stroke="#5c5c66" stroke-width="1"/>
  <!-- dorsal ridge -->
  <path d="M24 10.5 L22.5 19 L24 22 L25.5 19 Z" fill="#d9d9e0"/>
  <!-- lower engine block -->
  <rect x="18.5" y="38" width="11" height="5.5" rx="1.5" fill="#55555f" stroke="#17171e" stroke-width="1.2"/>
  <!-- engine glow -->
  <ellipse cx="24" cy="47" rx="7.5" ry="2.6" fill="url(#glow)"/>
  <circle cx="24" cy="46.8" r="2" fill="#fffbe8"/>
</svg>
